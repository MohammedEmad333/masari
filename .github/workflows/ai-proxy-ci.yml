name: Masari AI proxy CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/ai-proxy/**'
      - '.github/workflows/ai-proxy-ci.yml'
  push:
    branches: [main]
    paths:
      - 'server/ai-proxy/**'
      - '.github/workflows/ai-proxy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check server/ai-proxy/index.mjs
          node --check server/ai-proxy/core.mjs
          node --check server/ai-proxy/firestore_quota.mjs
          node --check server/ai-proxy/postgres_quota.mjs
          node --check server/ai-proxy/test/core.test.mjs
          node --check server/ai-proxy/test/firestore_quota.test.mjs
      - name: Run isolated proxy tests
        working-directory: server/ai-proxy
        run: node --test
      - name: Validate Oracle Docker Compose configurations
        env:
          CADDY_NETWORK: ci-caddy-network
          MASARI_UID: '1000'
          MASARI_GID: '1000'
        run: |
          docker compose -f server/ai-proxy/compose.oracle.yaml config --quiet
          docker compose -f server/ai-proxy/compose.oracle.yaml \
            -f server/ai-proxy/compose.oracle-caddy-network.yaml config --quiet
          docker compose -f server/ai-proxy/compose.oracle.yaml \
            -f server/ai-proxy/compose.oracle-postgres.yaml config --quiet
      - name: Smoke-build production container image
        run: docker build -t masari-ai-proxy:ci server/ai-proxy
