name: moodle_reminder
description: A secure Moodle calendar companion with background sync and deadline reminders.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  intl: ^0.20.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
