name: Manual Release

# Main branch releases are normally published after verified Flutter CI
# by publish-release.yml. This remains a manual recovery workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Masari GitHub Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          RELEASE_VERSION="${VERSION%%+*}"
          TAG="v${RELEASE_VERSION}"
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify changelog entry
        shell: bash
        run: |
          grep -q "^## ${{ steps.version.outputs.version }}$" CHANGELOG.md

      - name: Install dependencies
        run: flutter pub get

      - name: Verify source
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Prepare stable signing certificate
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_STORE_PASSWORD PLAY_KEY_ALIAS PLAY_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/masari-upload.jks"
          test -s "$RUNNER_TEMP/masari-upload.jks"
          # Require the Firebase-registered official release certificate.
          SIGNER_SHA256="$(keytool -list -keystore "$RUNNER_TEMP/masari-upload.jks" -storepass "$PLAY_STORE_PASSWORD" -alias "$PLAY_KEY_ALIAS" -v | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$SIGNER_SHA256" = "bff786abee97d6a467103b95fed08ce536a683edc362d9f3a712ab77932230d4"

      - name: Build signed official APK
        env:
          PLAY_STORE_BUILD: 'true'
          PLAY_KEYSTORE_PATH: ${{ runner.temp }}/masari-upload.jks
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=MASARI_AI_PROXY_URL=https://ai.edubridge.win/v1/assistant/ask
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify "$APK"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/masari-apk-badging.txt"
          grep -Fq "package: name='com.mohammedemad333.masari'" "$RUNNER_TEMP/masari-apk-badging.txt"

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/masari-${{ steps.version.outputs.tag }}.apk"
          (cd release-assets && sha256sum "masari-${{ steps.version.outputs.tag }}.apk" \
            > "masari-${{ steps.version.outputs.tag }}.apk.sha256")

      - name: Prepare release notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '${{ steps.version.outputs.version }}'
          text = Path('CHANGELOG.md').read_text()
          match = re.search(rf'^## {re.escape(version)}\s*$\n(.*?)(?=^##\s|\Z)', text, re.M | re.S)
          if not match:
              raise SystemExit(f'CHANGELOG section for {version} not found')
          notes = match.group(1).strip()
          Path('release-notes.md').write_text(notes + '\n')
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace its signature."
            exit 0
          else
            gh release create "$TAG" \
              release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Masari $TAG" \
              --notes-file release-notes.md
          fi
