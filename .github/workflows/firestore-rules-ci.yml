name: Masari Firestore rules CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'firebase/**'
      - '.github/workflows/firestore-rules-ci.yml'
  push:
    branches: [main]
    paths:
      - 'firebase/**'
      - '.github/workflows/firestore-rules-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: Firestore emulator authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test dependencies
        run: npm install --prefix firebase --no-package-lock --ignore-scripts
      - name: Validate Firestore rules in emulator
        run: |
          cd firebase
          npm run test:rules
