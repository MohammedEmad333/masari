name: Google Oracle test APK (manual)

on:
  workflow_dispatch:
  # QA-only push trigger. No main branch, no release publication.
  push:
    branches:
      - qa/oracle-accounts-ai-main-20261112
    paths:
      - '.github/workflows/google-oracle-test-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Signed Oracle accounts + AI test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Prepare official signing certificate
        shell: bash
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_STORE_PASSWORD PLAY_KEY_ALIAS PLAY_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/masari-upload.jks"
          SIGNER_SHA256="$(keytool -list -keystore "$RUNNER_TEMP/masari-upload.jks" -storepass "$PLAY_STORE_PASSWORD" -alias "$PLAY_KEY_ALIAS" -v | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$SIGNER_SHA256" = "bff786abee97d6a467103b95fed08ce536a683edc362d9f3a712ab77932230d4"

      - name: Build signed Oracle accounts test APK
        shell: bash
        env:
          PLAY_STORE_BUILD: 'true'
          PLAY_KEYSTORE_PATH: ${{ runner.temp }}/masari-upload.jks
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          # Production accounts and AI now share Masari PostgreSQL.
          # Only manually dispatched or QA-branch builds; never a store release.
          # Real-device QA must still verify Oracle bearer use with AI.
          flutter build apk --release \
            --dart-define=MASARI_ACCOUNTS_API_URL=https://masari-accounts.edubridge.win \
            --dart-define=MASARI_AI_PROXY_URL=https://ai.edubridge.win/v1/assistant/ask
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.mohammedemad333.masari'"
          mkdir -p dist
          cp "$APK" dist/masari-oracle-accounts-ai-test.apk
          (cd dist && sha256sum masari-oracle-accounts-ai-test.apk > masari-oracle-accounts-ai-test.apk.sha256)

      - name: Upload test APK (not an official release)
        uses: actions/upload-artifact@v7
        with:
          name: masari-oracle-accounts-ai-test-apk
          path: |
            dist/masari-oracle-accounts-ai-test.apk
            dist/masari-oracle-accounts-ai-test.apk.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
