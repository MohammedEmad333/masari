name: Flutter CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format lib test
          git diff -- lib/screens/home_shell.dart lib/services/sync_feedback.dart test/sync_feedback_test.dart
          git diff --exit-code -- lib/screens/home_shell.dart lib/services/sync_feedback.dart test/sync_feedback_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: moodle-reminder-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create CI-only signing key for Google Play smoke test
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/masari-ci-upload.jks" \
            -storetype JKS \
            -storepass masari-ci-only -keypass masari-ci-only \
            -alias ci -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Masari CI, OU=Testing, O=Masari, C=US"

      - name: Smoke-test Masari Play AAB (temporary key, never publish)
        env:
          PLAY_STORE_BUILD: 'true'
          PLAY_KEYSTORE_PATH: ${{ runner.temp }}/masari-ci-upload.jks
          PLAY_STORE_PASSWORD: masari-ci-only
          PLAY_KEY_ALIAS: ci
          PLAY_KEY_PASSWORD: masari-ci-only
        run: |
          flutter build appbundle --release
          test -s build/app/outputs/bundle/release/app-release.aab
          unzip -t build/app/outputs/bundle/release/app-release.aab >/dev/null
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
