# Add to compose.oracle.yaml only after provisioning both local password files.
# Existing Masari proxy remains bound to localhost:8097.
services:
  masari-ai:
    environment:
      MASARI_QUOTA_BACKEND: postgres
      MASARI_ORACLE_AUTH_ENABLED: ${MASARI_ORACLE_AUTH_ENABLED:-false}
      MASARI_GOOGLE_OIDC_ENABLED: ${MASARI_GOOGLE_OIDC_ENABLED:-false}
      MASARI_GOOGLE_OAUTH_CLIENT_ID: ${MASARI_GOOGLE_OAUTH_CLIENT_ID:-}
      MASARI_POSTGRES_HOST: masari-ai-postgres
      MASARI_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_client_password
    volumes:
      - type: bind
        source: ./private/postgres_client_password
        target: /run/secrets/postgres_client_password
        read_only: true
    depends_on:
      masari-ai-postgres:
        condition: service_healthy

  masari-accounts:
    image: masari-accounts:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masari-accounts
    command: ["node", "accounts_index.mjs"]
    init: true
    restart: unless-stopped
    read_only: true
    user: "${MASARI_UID:-1000}:${MASARI_GID:-1000}"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8098"
      MASARI_GOOGLE_OAUTH_CLIENT_ID: ${MASARI_GOOGLE_OAUTH_CLIENT_ID:-}
      MASARI_POSTGRES_HOST: masari-ai-postgres
      MASARI_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_client_password
    volumes:
      - type: bind
        source: ./private/postgres_client_password
        target: /run/secrets/postgres_client_password
        read_only: true
    depends_on:
      masari-ai-postgres:
        condition: service_healthy
    # Never publish this on 0.0.0.0 or expose a PostgreSQL port publicly.
    ports:
      - "127.0.0.1:${MASARI_ACCOUNTS_HOST_PORT:-8099}:8098"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8098/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  masari-ai-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: masari_ai
      POSTGRES_DB: masari_ai
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_server_password
    volumes:
      - masari-ai-pgdata:/var/lib/postgresql/data
      - type: bind
        source: ./private/postgres_server_password
        target: /run/secrets/postgres_server_password
        read_only: true
    # Database is reachable only on the Compose-internal network.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masari_ai -d masari_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

volumes:
  masari-ai-pgdata:
