name: Publish Android release APK

on:
  workflow_run:
    workflows: ["Flutter CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: masari-release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish verified signed Masari APK
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Skip obsolete builds
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$CURRENT_SHA" != "$VERIFIED_SHA" ]; then
            echo "Latest main moved since this build; skipping outdated APK."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi


      - name: Set up Java 17
        if: steps.latest.outputs.publish == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.latest.outputs.publish == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Check signing configuration
        if: steps.latest.outputs.publish == 'true'
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_STORE_PASSWORD PLAY_KEY_ALIAS PLAY_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/masari-upload.jks"
          test -s "$RUNNER_TEMP/masari-upload.jks"
          # Require the Firebase-registered official release certificate.
          SIGNER_SHA256="$(keytool -list -keystore "$RUNNER_TEMP/masari-upload.jks" -storepass "$PLAY_STORE_PASSWORD" -alias "$PLAY_KEY_ALIAS" -v | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$SIGNER_SHA256" = "bff786abee97d6a467103b95fed08ce536a683edc362d9f3a712ab77932230d4"

      - name: Build official signed Masari APK
        if: steps.latest.outputs.publish == 'true'
        env:
          PLAY_STORE_BUILD: 'true'
          PLAY_KEYSTORE_PATH: ${{ runner.temp }}/masari-upload.jks
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release \
            --dart-define=MASARI_AI_PROXY_URL=https://ai.edubridge.win/v1/assistant/ask
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify "$APK"
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/masari-apk-badging.txt"
          grep -Fq "package: name='com.mohammedemad333.masari'" "$RUNNER_TEMP/masari-apk-badging.txt"

      - name: Prepare signed APK and checksum
        if: steps.latest.outputs.publish == 'true'
        id: version
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/p' pubspec.yaml | head -n1)"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid pubspec.yaml version" >&2
            exit 1
          fi
          TAG="v$APP_VERSION"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/masari-$TAG.apk"
          (cd dist && sha256sum "masari-$TAG.apk" > "masari-$TAG.apk.sha256")
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'apk=%s\n' "masari-$TAG.apk" >> "$GITHUB_OUTPUT"
          printf 'Masari %s\n\nSigned Android package: com.mohammedemad333.masari\nVerified main commit: %s\nFlutter CI: https://github.com/%s/actions/runs/%s\n\nThis cannot update earlier com.example.moodle_reminder installations. Google Play may re-sign bundles with a different app-signing certificate; use Play Internal Testing for the store installation.\n' \
            "$TAG" "$VERIFIED_SHA" "$GITHUB_REPOSITORY" \
            "${{ github.event.workflow_run.id }}" > dist/release-notes.md

      - name: Upload official signed APK to Actions artifacts
        if: steps.latest.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: masari-${{ steps.version.outputs.tag }}-signed-apk
          path: |
            dist/${{ steps.version.outputs.apk }}
            dist/${{ steps.version.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish immutable signed APK release
        if: steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.version.outputs.apk }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Refusing to overwrite its APK/signature."
            exit 0
          fi
          gh release create "$TAG" "dist/$APK" "dist/$APK.sha256" \
            --target "$VERIFIED_SHA" \
            --title "Masari $TAG" \
            --notes-file dist/release-notes.md \
            --latest --repo "$GITHUB_REPOSITORY"
