services:
  masari-ai:
    image: masari-ai-proxy:oracle-e5e57de
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masari-ai-proxy
    init: true
    restart: unless-stopped
    read_only: true
    user: "${MASARI_UID:-1000}:${MASARI_GID:-1000}"
    environment:
      NODE_ENV: production
      TOKENROUTER_API_KEY_FILE: /run/secrets/tokenrouter_api_key
      HOST: 0.0.0.0
      PORT: "8096"
    volumes:
      - type: bind
        source: ./private/tokenrouter_api_key
        target: /run/secrets/tokenrouter_api_key
        read_only: true
    # Bind only to localhost; Caddy provides public HTTPS.
    ports:
      - "127.0.0.1:${MASARI_AI_HOST_PORT:-8097}:8096"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8096/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
