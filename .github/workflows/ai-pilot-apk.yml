name: Masari AI signed pilot APK

# Explicitly opt-in signed artifact for device verification. NEVER publish
# this build to Releases or Google Play automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: masari-ai-pilot
  cancel-in-progress: false

jobs:
  signed-pilot:
    name: Validate and build signed AI pilot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install and verify Flutter source
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Load official signing identity and verify certificate
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_STORE_PASSWORD PLAY_KEY_ALIAS PLAY_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/masari-upload.jks"
          SIGNER_SHA256="$(keytool -list -keystore "$RUNNER_TEMP/masari-upload.jks" -storepass "$PLAY_STORE_PASSWORD" -alias "$PLAY_KEY_ALIAS" -v | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$SIGNER_SHA256" = "bff786abee97d6a467103b95fed08ce536a683edc362d9f3a712ab77932230d4"

      - name: Build signed AI pilot APK with public HTTPS endpoint
        env:
          PLAY_STORE_BUILD: 'true'
          PLAY_KEYSTORE_PATH: ${{ runner.temp }}/masari-upload.jks
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=MASARI_AI_PROXY_URL=https://ai.edubridge.win/v1/assistant/ask
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify "$APK"
          APK_CERT_SHA256="$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$APK_CERT_SHA256" = "bff786abee97d6a467103b95fed08ce536a683edc362d9f3a712ab77932230d4"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.mohammedemad333.masari'"

      - name: Prepare pilot artifact (not a public release)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/masari-ai-pilot.apk
          (cd dist && sha256sum masari-ai-pilot.apk > masari-ai-pilot.apk.sha256)
          printf '%s\n' \
            'Masari AI pilot — signed with the official Firebase-registered upload key.' \
            'HTTPS endpoint: https://ai.edubridge.win/v1/assistant/ask' \
            'Requires Firebase sign-in, App Check / Play Integrity, and explicit consent.' \
            'For controlled device testing only. Not published to GitHub Releases or Play Store.' \
            'DO NOT test the online assistant until provider-side budget caps and HTTPS are verified.' \
            > dist/README.txt

      - name: Upload pilot APK to Actions Artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: masari-ai-pilot-${{ github.run_number }}
          path: |
            dist/masari-ai-pilot.apk
            dist/masari-ai-pilot.apk.sha256
            dist/README.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
