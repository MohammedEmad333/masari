name: Flutter CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test and smoke-build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Compilation-only APK: same permanent ID, temporary debug signature.
      # Do not distribute; official signed APKs are published after green main CI.
      - name: Smoke-build Masari APK (not for distribution)
        run: |
          flutter build apk --release
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -F "package: name='com.mohammedemad333.masari'"

      - name: Create CI-only signing key for Google Play smoke test
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/masari-ci-upload.jks" \
            -storetype JKS \
            -storepass masari-ci-only -keypass masari-ci-only \
            -alias ci -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Masari CI, OU=Testing, O=Masari, C=US"

      - name: Smoke-test Masari Play AAB (temporary key, never publish)
        env:
          PLAY_STORE_BUILD: 'true'
          PLAY_KEYSTORE_PATH: ${{ runner.temp }}/masari-ci-upload.jks
          PLAY_STORE_PASSWORD: masari-ci-only
          PLAY_KEY_ALIAS: ci
          PLAY_KEY_PASSWORD: masari-ci-only
        run: |
          flutter build appbundle --release
          test -s build/app/outputs/bundle/release/app-release.aab
          unzip -t build/app/outputs/bundle/release/app-release.aab >/dev/null
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
