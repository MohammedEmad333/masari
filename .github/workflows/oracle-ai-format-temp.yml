name: Format Oracle AI PR
on:
  push:
    branches:
      - feat/masari-ai-oracle-secure-session-client
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Format changed Dart files
        run: |
          dart format lib/services/ai_assistant_client.dart lib/services/oracle_ai_session_store.dart lib/services/oracle_ai_pairing_client.dart lib/screens/ai_assistant_screen.dart lib/screens/oracle_ai_pairing_screen.dart test/ai_assistant_client_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m 'style(ai): format Oracle pairing files with Dart SDK'
            git push origin HEAD:feat/masari-ai-oracle-secure-session-client
          fi
