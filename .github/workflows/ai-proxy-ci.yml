name: Masari AI proxy CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/ai-proxy/**'
      - '.github/workflows/ai-proxy-ci.yml'
  push:
    branches: [main]
    paths:
      - 'server/ai-proxy/**'
      - '.github/workflows/ai-proxy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check server/ai-proxy/index.mjs
          node --check server/ai-proxy/accounts_index.mjs
          node --check server/ai-proxy/oracle_account_api.mjs
          node --check server/ai-proxy/oracle_account_store.mjs
          node --check server/ai-proxy/core.mjs
          node --check server/ai-proxy/firestore_quota.mjs
          node --check server/ai-proxy/postgres_quota.mjs
          node --check server/ai-proxy/test/core.test.mjs
          node --check server/ai-proxy/test/firestore_quota.test.mjs
      - name: Run isolated proxy tests
        working-directory: server/ai-proxy
        run: node --test
      - name: Validate Oracle Docker Compose configurations
        env:
          CADDY_NETWORK: ci-caddy-network
          MASARI_UID: '1000'
          MASARI_GID: '1000'
        run: |
          docker compose -f server/ai-proxy/compose.oracle.yaml config --quiet
          docker compose -f server/ai-proxy/compose.oracle.yaml \
            -f server/ai-proxy/compose.oracle-caddy-network.yaml config --quiet
          docker compose -f server/ai-proxy/compose.oracle.yaml \
            -f server/ai-proxy/compose.oracle-postgres.yaml config --quiet
          docker compose -f server/ai-proxy/compose.oracle.yaml \
            -f server/ai-proxy/compose.oracle-postgres.yaml \
            -f server/ai-proxy/compose.oracle-accounts-caddy-network.yaml config --quiet
      - name: Smoke-build production container image
        run: docker build -t masari-ai-proxy:ci server/ai-proxy

      - name: Verify all production runtime imports inside Docker image
        run: |
          docker run --rm --network none --entrypoint node masari-ai-proxy:ci \
            --input-type=module -e '
              import { readFileSync, existsSync } from "node:fs";
              import { dirname, resolve } from "node:path";
              for (const entrypoint of ["/app/index.mjs", "/app/accounts_index.mjs"]) {
                const source = readFileSync(entrypoint, "utf8");
                const imports = [...source.matchAll(/from\s+["\x27](\.[^"\x27]+)["\x27]/g)]
                  .map(match => match[1]);
                if (imports.length === 0) throw new Error("No imports discovered");
                for (const relative of imports) {
                  const path = resolve(dirname(entrypoint), relative);
                  if (!existsSync(path)) throw new Error("Missing runtime module: " + relative);
                  await import(path);
                }
                console.log("PASS: " + entrypoint + " " + imports.length + " local imports");
              }
            '

  postgres-integration:
    name: Oracle accounts PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: masari_ci
          POSTGRES_PASSWORD: ci-only-not-production
          POSTGRES_DB: masari_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U masari_ci -d masari_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test driver
        working-directory: server/ai-proxy
        run: npm install --no-audit --no-fund --ignore-scripts --no-package-lock
      - name: Verify account isolation, CAS, revocation and deletion in PostgreSQL
        working-directory: server/ai-proxy
        env:
          MASARI_TEST_PG_URL: postgresql://masari_ci:ci-only-not-production@127.0.0.1:5432/masari_ci
        run: node --test test/oracle_account_db.integration.test.mjs
