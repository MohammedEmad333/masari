# Production Accounts API deployment used alongside compose.oracle.yaml.
# Run from server/ai-proxy with the same private secret files and ai-proxy_default network.
name: masari-accounts-production

services:
  accounts:
    image: masari-accounts:oracle-e5e57de
    container_name: masari-accounts-api
    command: ["node", "accounts_index.mjs"]
    init: true
    restart: unless-stopped
    read_only: true
    user: "1001:1001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8098"
      MASARI_POSTGRES_HOST: masari-ai-postgres
      MASARI_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_client_password
      MASARI_GOOGLE_OAUTH_CLIENT_ID: "${MASARI_GOOGLE_OAUTH_CLIENT_ID:?Required}"
    volumes:
      - type: bind
        source: ./private/postgres_client_password
        target: /run/secrets/postgres_client_password
        read_only: true
    ports:
      - "127.0.0.1:8101:8098"
    networks:
      - masari_production_network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8098/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

networks:
  masari_production_network:
    external: true
    name: ai-proxy_default
