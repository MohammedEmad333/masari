name: moodle_reminder
description: Masari, a secure Moodle calendar companion with background sync and deadline reminders.
publish_to: 'none'
version: 2.2.10+14

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  file_picker: ^13.1.0
  path_provider: ^2.1.5
  open_filex: ^5.0.0
  qr_flutter: ^4.1.0
  archive: ^4.0.9
  crypto: ^3.0.6
  share_plus: ^13.3.1
  http: ^1.5.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  intl: ^0.20.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
